; Yeelight D2 Codex Status Bridge configuration
; ================================================================
;
; This file controls both:
;   1. Assistant/Codex status lighting: idle, thinking, prompt, error.
;   2. Optional audio beat lighting driven by music_audio.py.
;
; The bridge reloads this file on every state change, so most visual tweaks do
; not require a bridge restart. Bridge-level settings that affect timers are
; also reloaded when a state is applied.
;
; Value formats:
;   - RGB colors use: red,green,blue
;     Example: 255,214,36 is warm yellow.
;     Example: 34,94,255 is saturated blue.
;   - Brightness is 1..100.
;   - Durations are milliseconds unless the name ends in "_seconds".
;   - For effect loops, 0 usually means "repeat until another state replaces it".


; ----------------------------------------------------------------
; [bridge]
; ----------------------------------------------------------------
; Settings owned by yeelight_bridge.py itself.
;
; idle_off_seconds:
;   How long the lamp may sit in the idle state before the bridge turns the
;   bulb off. This is useful when Codex is done and you walk away.
;
;   Examples:
;     idle_off_seconds = 120   ; turn off after 2 minutes of idle
;     idle_off_seconds = 900   ; turn off after 15 minutes of idle
;     idle_off_seconds = 0     ; never turn off automatically
[bridge]
idle_off_seconds = 120


; ----------------------------------------------------------------
; [music]
; ----------------------------------------------------------------
; Defaults for:
;
;   python .\music_audio.py lights
;
; Command-line flags override these values for one run.
;
; bridge_url:
;   Local HTTP bridge URL. Change this only if you run the bridge on another
;   host or port.
;
; seconds:
;   Default music-light run length.
;
; cooldown_ms:
;   Minimum time between detected beat color hits. Higher values make the lamp
;   calmer and prevent double-hits. Lower values make it more reactive.
;
;   Examples:
;     cooldown_ms = 180  ; busy, club-like, may double-hit
;     cooldown_ms = 320  ; balanced default
;     cooldown_ms = 500  ; calmer, only bigger beats
;
; min_send_ms:
;   Minimum time between non-beat level-following updates. These are the dimmer
;   "background" updates between beat hits. Higher values reduce traffic.
;
; beat_brightness:
;   Brightness used for beat hits.
;
; idle_brightness:
;   Minimum brightness used between beats.
;
; gain:
;   Converts audio RMS level into brightness between beats. If the lamp stays
;   too bright between beats, lower this. If quiet passages disappear, raise it.
;
;   Examples:
;     gain = 400   ; subtler level-following
;     gain = 700   ; balanced default
;     gain = 1000  ; brighter level-following
;
; idle_rgb:
;   Color used between beats.
;
; palette:
;   Semicolon-separated list of RGB colors used for beat hits. The script cycles
;   through the list.
;
; restore_state:
;   State to restore when music_audio.py exits normally or with Ctrl+C.
;   Use "idle" for normal behavior. Use an empty value to leave the last music
;   color on the bulb.
[music]
bridge_url = http://127.0.0.1:8765
seconds = 20
cooldown_ms = 180
min_send_ms = 350
beat_brightness = 100
idle_brightness = 10
gain = 800
idle_rgb = 28,42,72
palette = 0,170,255;255,52,130;255,214,36;68,255,154;164,96,255
restore_state = idle


; ----------------------------------------------------------------
; Status effect sections
; ----------------------------------------------------------------
; Each named status supports these fields:
;
; effect:
;   solid - apply one color/brightness.
;   pulse - alternate between brightness and low_brightness.
;   flash - like pulse, but count can limit the number of cycles.
;
; color:
;   RGB color for the effect.
;
; brightness:
;   High brightness level for solid, pulse, or flash.
;
; low_brightness:
;   Low brightness level for pulse or flash.
;
; on_ms:
;   How long the high-brightness phase lasts.
;
; off_ms:
;   How long the low-brightness phase lasts.
;
; duration_ms:
;   Total effect duration. 0 means run until replaced by another state.
;
; count:
;   For flash only. 0 means repeat until replaced by another state.
;
; after:
;   What to do when a finite effect ends:
;     hold - hold the same color
;     idle - switch to the idle effect
;     off  - turn off the bulb


; Idle is the calm "Codex is not currently working" state.
;
; Examples:
;   Warm amber: color = 255,184,92
;   Soft white: color = 255,235,200
;   Dim green:  color = 80,180,120
[idle]
effect = solid
color = 255,184,92
brightness = 12
after = hold


; Thinking is the normal "Codex is working" state.
;
; Examples:
;   Faster pulse: on_ms = 500 and off_ms = 500
;   Slower pulse: on_ms = 1400 and off_ms = 1400
;   Dimmer blue:  brightness = 55 and low_brightness = 6
[thinking]
effect = pulse
color = 34,94,255
brightness = 100
low_brightness = 1
on_ms = 1000
off_ms = 1000
duration_ms = 0
after = hold


; Prompt is the "Codex needs your approval/input" state.
; During music mode, prompt owns the bulb until Codex resumes thinking/idle.
;
; Examples:
;   Solid yellow instead of pulsing:
;     effect = solid
;     brightness = 90
;   More urgent pulse:
;     on_ms = 350
;     off_ms = 350
[prompt]
effect = pulse
color = 255,214,36
brightness = 100
low_brightness = 1
on_ms = 900
off_ms = 900
duration_ms = 0
after = hold


; Error is the "blocked or user intervention required" state.
; During music mode, error owns the bulb until Codex resumes thinking/idle.
; Indefinite flashes use the bulb's color-flow support when available, avoiding
; a rapid command loop that can hit Yeelight LAN rate limits.
;
; Examples:
;   Six red flashes then hold red:
;     count = 6
;     after = hold
;   Flash briefly then return to idle:
;     count = 4
;     after = idle
[error]
effect = flash
color = 255,0,0
brightness = 100
low_brightness = 1
on_ms = 260
off_ms = 180
duration_ms = 0
count = 0
after = hold
